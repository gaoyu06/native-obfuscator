<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 880" width="1160" height="880" role="img" aria-label="native-obfuscator end-to-end pipeline" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'Droid Sans Fallback', sans-serif">
  <defs>
    <marker id="pArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1159" height="879" rx="16" fill="#f7f9fc" stroke="#dbe3ec"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#1f2937">End-to-end pipeline <tspan font-size="15" font-weight="500" fill="#55627a">&#183; 端到端流水线</tspan></text>

  <!-- Row 1: load / filter / preprocess -->
  <g filter="url(#pShadow)">
    <rect x="40" y="64" width="170" height="96" rx="10" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.5"/>
    <rect x="270" y="64" width="270" height="96" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="600" y="64" width="290" height="96" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="125" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Input JAR</text>
  <text x="125" y="124" text-anchor="middle" font-size="13" fill="#55627a">your application</text>
  <text x="125" y="142" text-anchor="middle" font-size="13" fill="#55627a">待处理 JAR</text>

  <text x="405" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Load + filter <tspan font-size="12.5" font-weight="500" fill="#55627a">加载与筛选</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="405" y="113" text-anchor="middle">NativeObfuscator.process</text>
    <text x="405" y="129" text-anchor="middle">ASM ClassNode</text>
    <text x="405" y="145" text-anchor="middle">ClassMethodFilter (+@Native)</text>
  </g>

  <text x="745" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Preprocess <tspan font-size="12.5" font-weight="500" fill="#55627a">字节码预处理</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="745" y="113" text-anchor="middle">IndyPreprocessor &#183; LdcPreprocessor</text>
    <text x="745" y="129" text-anchor="middle">COMPUTE_MAXS | COMPUTE_FRAMES</text>
  </g>
  <text x="745" y="147" text-anchor="middle" font-size="12.5" fill="#55627a">re-read &#8594; frames authoritative</text>

  <line x1="212" y1="112" x2="266" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <line x1="542" y1="112" x2="596" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>

  <!-- Row 2: per-method choke point -->
  <path d="M 745 162 L 745 180 L 580 180 L 580 196" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <g filter="url(#pShadow)">
    <rect x="430" y="200" width="300" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="580" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Per-method codegen</text>
  <text x="580" y="247" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">NativeObfuscator method loop</text>
  <text x="580" y="265" text-anchor="middle" font-size="12.5" fill="#55627a">dispatch per selected method &#183; 按选定方法分派</text>

  <!-- split arrows to the three generators -->
  <path d="M 580 278 L 580 296 L 220 296 L 220 316" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <line x1="580" y1="278" x2="580" y2="316" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <path d="M 580 278 L 580 296 L 940 296 L 940 316" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>

  <!-- Row 3: three generators -->
  <g filter="url(#pShadow)">
    <rect x="50" y="320" width="340" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="410" y="320" width="340" height="120" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="770" y="320" width="340" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <rect x="304" y="330" width="76" height="22" rx="11" fill="#16a34a"/>
  <text x="342" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">DEFAULT</text>
  <rect x="672" y="330" width="68" height="22" rx="11" fill="#8b5cf6"/>
  <text x="706" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OPT-IN</text>
  <rect x="1002" y="330" width="98" height="22" rx="11" fill="#d97706"/>
  <text x="1051" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">DEFAULT OFF</text>

  <text x="66" y="349" font-size="15" font-weight="700" fill="#1f2937">Legacy snippets</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="66" y="372">GenericInstructionHandler</text>
    <text x="66" y="388">Snippets &#8592; cppsnippets.properties</text>
    <text x="66" y="404">--codegen=legacy</text>
  </g>
  <text x="66" y="426" font-size="12.5" fill="#55627a">string concatenation &#8594; C++ &#183; 字符串拼接</text>

  <text x="426" y="349" font-size="15" font-weight="700" fill="#1f2937">Typed CFG IR</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="426" y="372">AsmToIr &#183; CfgBuilder &#8594; typed CFG</text>
    <text x="426" y="388">DirectCppStrategy / eval lowering</text>
    <text x="426" y="404">--codegen=ir</text>
  </g>
  <text x="426" y="426" font-size="12.5" fill="#55627a">IrCppEmitter &#8594; structured C++ &#183; 结构化生成</text>

  <text x="786" y="349" font-size="15" font-weight="700" fill="#1f2937">Interpreter stream</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="786" y="372">InterpreterMethodEmitter</text>
    <text x="786" y="388">ISA v4: int/long + refs + ATHROW</text>
    <text x="786" y="404">--backend=interpreter</text>
  </g>
  <text x="786" y="426" font-size="12.5" fill="#55627a">no NEW / invoke / fields &#183; 不含对象创建与调用</text>

  <!-- per-method fallback from IR to legacy -->
  <path d="M 500 442 L 500 476 L 300 476 L 300 446" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#pArrow)"/>
  <text x="400" y="462" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6d28d9">per-method fallback &#183; 逐方法回退</text>

  <!-- Row 4: class assembly + runtime helpers -->
  <line x1="220" y1="442" x2="220" y2="496" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <line x1="580" y1="442" x2="580" y2="496" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <line x1="940" y1="442" x2="940" y2="496" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>

  <g filter="url(#pShadow)">
    <rect x="60" y="500" width="1040" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="740" y="512" width="344" height="86" rx="8" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3"/>
  </g>
  <text x="400" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Class assembly <tspan font-size="12.5" font-weight="500" fill="#55627a">类级装配</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="400" y="552" text-anchor="middle">ClassSourceBuilder &#183; CMakeFilesBuilder</text>
    <text x="400" y="568" text-anchor="middle">MainSourceBuilder &#183; StringPool</text>
  </g>
  <text x="400" y="590" text-anchor="middle" font-size="12.5" fill="#55627a">writes cpp/ tree + rewrites methods to native stubs</text>

  <text x="912" y="538" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Runtime helpers <tspan font-size="12" font-weight="500" fill="#55627a">运行时辅助</tspan></text>
  <text x="912" y="560" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#334155">native_jvm.cpp/.hpp &#183; string_pool.*</text>
  <text x="912" y="580" text-anchor="middle" font-size="12" fill="#55627a">copied into cpp/ &#183; 随源码打包</text>

  <!-- Row 5: outputs and native build -->
  <path d="M 300 612 L 300 634 L 185 634 L 185 656" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <path d="M 560 612 L 560 646 L 1025 646 L 1025 656" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>

  <g filter="url(#pShadow)">
    <rect x="60" y="660" width="250" height="96" rx="10" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.5"/>
    <rect x="370" y="660" width="230" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="660" y="660" width="200" height="96" rx="10" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.5"/>
    <rect x="920" y="660" width="210" height="96" rx="10" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.5"/>
  </g>
  <text x="185" y="688" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Generated cpp/ tree</text>
  <text x="185" y="710" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">*.cpp / *.hpp &#183; CMakeLists.txt</text>
  <text x="185" y="732" text-anchor="middle" font-size="12.5" fill="#55627a">includes native_jvm.* &#183; 生成的 C++ 源</text>

  <text x="485" y="688" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Native build</text>
  <text x="485" y="710" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">cmake / --use-zig</text>
  <text x="485" y="732" text-anchor="middle" font-size="12.5" fill="#55627a">separate step &#183; 独立编译步骤</text>

  <text x="760" y="688" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Shared library</text>
  <text x="760" y="710" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">.so / .dll / .dylib</text>
  <text x="760" y="732" text-anchor="middle" font-size="12.5" fill="#55627a">e.g. x64-linux.so</text>

  <text x="1025" y="688" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Output JAR</text>
  <text x="1025" y="710" text-anchor="middle" font-size="12.5" fill="#55627a">native stubs + loader</text>
  <text x="1025" y="732" text-anchor="middle" font-size="12.5" fill="#55627a">libs copied into native0/</text>

  <line x1="312" y1="708" x2="366" y2="708" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <line x1="602" y1="708" x2="656" y2="708" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <line x1="862" y1="708" x2="916" y2="708" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#pArrow)"/>

  <!-- Row 6: runtime -->
  <path d="M 1025 758 L 1025 828 L 890 828" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <g filter="url(#pShadow)">
    <rect x="280" y="800" width="600" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <text x="580" y="824" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">java -jar output.jar &#8212; JVM dispatches native stubs into the library over JNI</text>
  <text x="580" y="844" text-anchor="middle" font-size="12.5" fill="#55627a">运行时：JVM 通过 JNI 调入生成的共享库</text>
</svg>
