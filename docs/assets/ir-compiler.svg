<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-label="IR compiler internals" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'Droid Sans Fallback', sans-serif">
  <defs>
    <marker id="iArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="iArrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <filter id="iShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1159" height="699" rx="16" fill="#f7f9fc" stroke="#dbe3ec"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#1f2937">IR compiler internals (--codegen=ir) <tspan font-size="15" font-weight="500" fill="#55627a">&#183; IR 编译器内部结构</tspan></text>

  <!-- Row 1: frontend -->
  <g filter="url(#iShadow)">
    <rect x="40" y="70" width="230" height="90" rx="10" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.5"/>
    <rect x="330" y="70" width="250" height="90" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="640" y="70" width="250" height="90" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="155" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">ASM MethodNode</text>
  <text x="155" y="124" text-anchor="middle" font-size="12.5" fill="#55627a">preprocessed bytecode</text>
  <text x="155" y="142" text-anchor="middle" font-size="12.5" fill="#55627a">预处理后的字节码</text>

  <text x="455" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">JSR / RET inlining</text>
  <text x="455" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">JsrRetInliner</text>
  <text x="455" y="142" text-anchor="middle" font-size="12" fill="#55627a">well-formed only &#183; 仅内联规范子程序</text>

  <text x="765" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Frontend <tspan font-size="12.5" font-weight="500" fill="#55627a">前端</tspan></text>
  <text x="765" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">AsmToIr &#183; CfgBuilder</text>
  <text x="765" y="142" text-anchor="middle" font-size="12" fill="#55627a">blocks + typed values &#183; 基本块与类型值</text>

  <line x1="272" y1="115" x2="326" y2="115" stroke="#64748b" stroke-width="1.8" marker-end="url(#iArrow)"/>
  <line x1="582" y1="115" x2="636" y2="115" stroke="#64748b" stroke-width="1.8" marker-end="url(#iArrow)"/>

  <!-- Row 2: typed CFG -->
  <path d="M 765 162 L 765 180 L 580 180 L 580 196" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#iArrow)"/>
  <g filter="url(#iShadow)">
    <rect x="330" y="200" width="500" height="150" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="354" y="230" font-size="16" font-weight="700" fill="#1f2937">Typed CFG <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#5b21b6">IrMethod</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="354" y="258">IrBlock &#183; IrValue: i32/i64/f32/f64/ref</text>
    <text x="354" y="278">IrPhi &#183; IrTerminator &#183; IrExceptionEdge</text>
  </g>
  <text x="354" y="304" font-size="12.5" fill="#55627a">a jint add cannot silently consume a reference</text>
  <text x="354" y="326" font-size="12.5" fill="#55627a">类型化控制流图；非法状态不可表示</text>

  <!-- mini CFG sketch -->
  <g>
    <rect x="678" y="238" width="64" height="26" rx="6" fill="#f7f9fc" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="710" y="255" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5b21b6">B0</text>
    <rect x="636" y="300" width="64" height="26" rx="6" fill="#f7f9fc" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="668" y="317" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5b21b6">B1</text>
    <rect x="722" y="300" width="64" height="26" rx="6" fill="#f7f9fc" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="754" y="317" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#b91c1c">catch</text>
    <line x1="700" y1="266" x2="674" y2="296" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#iArrow)"/>
    <line x1="722" y1="266" x2="748" y2="296" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#iArrowRed)"/>
  </g>

  <!-- reject path -->
  <line x1="832" y1="275" x2="876" y2="275" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#iArrowRed)"/>
  <g filter="url(#iShadow)">
    <rect x="880" y="220" width="240" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  <text x="1000" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Unsupported construct</text>
  <text x="1000" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7f1d1d">UnsupportedIrConstructException</text>
  <text x="1000" y="290" text-anchor="middle" font-size="12.5" fill="#7f1d1d">per-method fallback to legacy;</text>
  <text x="1000" y="308" text-anchor="middle" font-size="12.5" fill="#7f1d1d">rejected &lt;init&gt; restored to bytecode</text>
  <text x="1000" y="330" text-anchor="middle" font-size="12.5" fill="#7f1d1d">逐方法回退 / 构造器还原字节码</text>

  <!-- split to lowering strategies (IrMethodCompiler: direct vs eval) -->
  <path d="M 580 352 L 580 372 L 305 372 L 305 396" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#iArrow)"/>
  <path d="M 580 352 L 580 372 L 855 372 L 855 396" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#iArrow)"/>

  <!-- Row 3: IR lowering strategies inside IrMethodCompiler -->
  <g filter="url(#iShadow)">
    <rect x="50" y="400" width="510" height="116" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="600" y="400" width="510" height="116" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <rect x="394" y="410" width="150" height="22" rx="11" fill="#16a34a"/>
  <text x="469" y="425" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">DEFAULT LOWERING</text>
  <rect x="996" y="410" width="98" height="22" rx="11" fill="#d97706"/>
  <text x="1045" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">DEFAULT OFF</text>

  <text x="66" y="428" font-size="15" font-weight="700" fill="#1f2937">Direct C++</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="66" y="452">DirectCppStrategy</text>
    <text x="66" y="468">--ir-lower=direct</text>
  </g>
  <text x="66" y="492" font-size="12.5" fill="#55627a">structured statements per block &#183; 逐块结构化语句</text>

  <text x="616" y="428" font-size="15" font-weight="700" fill="#1f2937">Shared evaluator</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="616" y="452">InterpreterStreamStrategy</text>
    <text x="616" y="468">--ir-lower=eval &#183; narrow integer slice</text>
  </g>
  <text x="616" y="492" font-size="12.5" fill="#55627a">only for methods that already built IR &#183; 仅限已建成 IR 的方法</text>

  <!-- Row 4: emit -->
  <path d="M 305 518 L 305 542 L 500 542 L 500 566" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#iArrow)"/>
  <path d="M 855 518 L 855 542 L 660 542 L 660 566" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#iArrow)"/>

  <g filter="url(#iShadow)">
    <rect x="330" y="570" width="500" height="88" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="580" y="600" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Emit <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#1e3a8a">IrCppEmitter &#183; CppAst &#183; MethodShellEmitter</tspan></text>
  <text x="580" y="622" text-anchor="middle" font-size="12.5" fill="#374151">structured .cpp / .hpp handed to class assembly</text>
  <text x="580" y="642" text-anchor="middle" font-size="12.5" fill="#55627a">生成结构化 C++，交给类级装配</text>
  <text x="580" y="672" text-anchor="middle" font-size="12" fill="#64748b">--backend=interpreter is a sibling NativeObfuscator path (InterpreterMethodEmitter), not an IrMethodCompiler lowering &#183; 解释器后端是并列路径，不在本图</text>
</svg>
